[project]
name = "soapbot"
version = "0.1.0"
description = "QQ group chat AI bot framework: multi-provider, persona cards, context compression, memory recall, vision, Bilibili watching, budget approval"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Every entry here is imported somewhere under src/soapbot. Three that were listed
# and never used have been removed — structlog (logging is stdlib + a ring buffer),
# watchdog (reload is an explicit call) and python-multipart (no multipart endpoint;
# the plugin upload takes a raw body instead). A dependency nobody imports is not
# free: it widens the audit surface and tells reviewers the project has a feature it
# does not.
#
# edge-tts used to be in that list because voice output did not exist. It does now,
# so it is back — as the optional extra below, not here. Speech is a vendor network
# client that most installs will never call, and putting it in the default set would
# make 'pip install and run' heavier for everyone to serve one feature.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "websockets==14.2",
    "pyyaml==6.0.3",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    "croniter==6.2.4",
    "apscheduler==3.11.3",
]

[project.optional-dependencies]
qq-official = ["qq-botpy==1.2.1"]
precision = ["tiktoken==0.14.0"]
# Text-to-speech for reply-as-voice. Inbound transcription needs no extra: it goes
# through the provider's ``transcribe`` slot, like every other model call.
voice = ["edge-tts==7.3.1"]
# Freezing the backend into the desktop sidecar. Build-time only: nothing at runtime
# imports PyInstaller, and `check_deps.py` keeps it out of the runtime pins. A separate
# extra rather than part of `dev`, so fixing a test does not pull in a 50 MB bundler.
sidecar = ["pyinstaller==6.22.3"]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-timeout==2.4.0",
    "respx==0.23.1",
    "ruff==0.17.3",
    "mypy==1.20.2",
    "types-pyyaml==6.0.12.20261103",
]

[project.scripts]
soapbot = "soapbot.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built management panel lives inside the package. Hatchling selects files with
# VCS rules by default, and a build output directory is exactly the kind of thing a
# .gitignore excludes — so without this the wheel would ship an app that serves a
# "not built" page on a deployment that cannot run npm.
artifacts = ["src/soapbot/webui/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/soapbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    # `retry_async` and the call helper below it both borrow the module-level `T`.
    # PEP 695 makes the type parameter local to one function, so adopting UP047 for one
    # of them leaves the other referencing a name that no longer exists. Ruff's own
    # autofix did exactly that here — it rewrote the signature and left `T = TypeVar(T)`
    # in place, which reads as a shadowed-but-alive binding. Deferring UP047 until the
    # module's generics are reviewed together; this is a deliberate deferral, not a bug.
    "UP047",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Example plugin directories use hyphenated names (the plugin id), which cannot be
# Python module names. mypy would see both `main.py` files as one duplicate module
# and abort the whole run with "errors prevented further checking" — a silent way
# to hide the real baseline. These two are example code, checked by ruff and by
# their own import-time tests instead.
exclude = ["src/soapbot/examples/plugins/qzone-.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
# A hung test used to run until GitHub's six-hour ceiling. This project has already had
# one job sit for 69 minutes waiting on a blocked `taskkill`, with nothing to show for it
# but a cancelled run. 120s is far above the slowest legitimate test (the restart
# contract waits ~20s), and `thread` is used because `signal` does not exist on Windows
# runners — a blocked C call must still be reported rather than waited on silently.
timeout = 120
timeout_method = "thread"
markers = [
    "no_env_key: run this test with DEEPSEEK_API_KEY deliberately unset",
]
