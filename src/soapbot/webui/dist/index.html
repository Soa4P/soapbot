  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- `light` matches the palette in base.css. It was left as `dark` when the console
         moved to a light theme, which makes the browser paint its own widgets — scrollbars,
         date pickers, the caret, autofill backgrounds — in dark chrome against a white page.
         Nothing in CSS can override those; only this hint and `color-scheme` can. -->
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Mirrors the CSP the API server sends as a header (app.py). It exists for the
         serving path the middleware does not cover: a static file server or a desktop
         bundle reading dist/ directly gets no response header from us, and S-FE-04
         noted exactly that. When both apply (served by the panel), the browser
         enforces the intersection — same policy, so no behaviour change. No bare
         ws:/wss: sources: this page opens no WebSocket; the ws:// strings in the UI
         are placeholder text for NapCat's config, not connections. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
