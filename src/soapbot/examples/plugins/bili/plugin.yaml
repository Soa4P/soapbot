name: bili
version: 1.0.0
entry: main:BiliPlugin
description: B 站登录态查询。读取本账号的观看历史（命令 bili-history），按 bvid 拉公开元数据拼摘要（命令 bili-look）。只向宿主钉死的 bilibili 域发 GET，携带操作者配置的登录 Cookie，插件代码拿不到也不存储 Cookie；不外发数据；历史的标题与 bvid 存进插件加密 storage（最多 50 条）用于去重提示，bili-forget 可清空，Cookie 永不落盘。
author: soapbot
trust: trusted
channel: official
min_host_version: 0.1.0
capabilities:
  - command
  - bilibili
  - storage
