name: ai-review

# `pull_request_target` is the only trigger that gives a fork PR access to a secret.
# It is also the trigger that can hand that secret to attacker-controlled code, so the
# two rules below are not style preferences:
#
#   1. checkout is pinned to the *base* commit — the workflow and the script it runs are
#      the reviewed ones, not whatever the PR added;
#   2. the PR is only ever read as text through `gh pr diff`. No `pip install`, no
#      `npm install`, no running anything from the PR.
#
# This job never approves and never merges. It posts a comment and a label; the merge
# decision stays with the deterministic checks and the maintainer.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped: the author is still working, and a comment per push teaches
    # people to ignore the comments.
    if: github.event.pull_request.draft == false
    # 25 rather than 15: fetching a large diff, one slow model round-trip and the comment
    # call all sit inside this budget, while a hung job still stops long before GitHub's
    # six-hour default.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the diff as text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff"
          wc -c "$RUNNER_TEMP/pr.diff"

      - name: Ask the model
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'deepseek-chat' }}
          PR_DIFF_PATH: ${{ runner.temp }}/pr.diff
          AI_REVIEW_COMMENT_PATH: ${{ runner.temp }}/comment.md
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
        run: python scripts/ai_review.py

      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - name: Label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          # One colour per verdict. A wall of identical blue labels is indistinguishable
          # at a glance, which is the only thing a label is for; `--force` also repaints
          # any label created by an older run of this workflow.
          case "$VERDICT" in
            safe)      label="ai:safe";         color="0E8A16" ;;
            malicious) label="ai:malicious";    color="B60205" ;;
            *)         label="ai:needs-review"; color="FBCA04" ;;
          esac
          gh label create "$label" --repo "$GITHUB_REPOSITORY" \
            --color "$color" --description "AI review verdict" --force >/dev/null 2>&1 || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$label"

      - name: Enforce review mode
        # Last step on purpose. In `block` mode this fails the job, and a failed step
        # stops the ones after it — putting it before Comment/Label would leave a red X
        # with no explanation on the PR, which is worse than the observe-only default.
        env:
          MODE: ${{ vars.AI_REVIEW_MODE || 'observe' }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          DEGRADED: ${{ steps.review.outputs.degraded }}
        run: |
          echo "mode=$MODE verdict=$VERDICT degraded=$DEGRADED"
          # `case` rather than `if [ "$MODE" != block ]`: an unknown value (a typo like
          # "Block", a trailing space) would fall into the observe branch and quietly do
          # nothing — the same class of bug as the variable nobody read.
          case "$MODE" in
            observe)
              echo "observe mode: the verdict is advisory and does not fail the job"
              exit 0
              ;;
            block)
              ;;
            *)
              echo "::error::未知的 AI_REVIEW_MODE=$MODE；只接受 observe 或 block"
              exit 1
              ;;
          esac
          if [ "$DEGRADED" = "true" ] || [ "$VERDICT" != "safe" ]; then
            echo "::error::AI review blocks this PR: verdict=$VERDICT degraded=$DEGRADED"
            exit 1
          fi
          echo "block mode: verdict=$VERDICT, nothing to block"
