name: ci

# Five jobs, because they fail for different reasons and an operator reading a red
# badge should not have to guess which one:
#   backend  — does the code work
#   frontend — does the panel build (a broken panel means `soapbot start` serves a
#              "not built" page on a deployment that has no npm)
#   desktop  — does the Tauri shell still compile against Tauri 2
#   package  — does the *wheel* contain what the tests tested
#
# The package job exists because of a measured defect: the built panel was inside a
# gitignored directory, so the wheel shipped an app without a UI while every test
# passed against the source tree.

on:
  push:
    # `master` is the actual default branch of this repository. Listing only `main`
    # meant the workflow never ran on a push at all — the badge would stay grey while
    # 800 tests silently went unexecuted. Both names are kept so a future rename to
    # `main` does not reintroduce the same dead badge.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  SOAPBOT_ENABLE_RUNTIME: "false"

jobs:
  backend:
    # A hung test used to occupy a runner until GitHub's six-hour default; this project
    # already had the Windows matrix sit for 69 minutes on a blocked `taskkill`. Keep
    # headroom over the slowest observed run (~6 min) without allowing that again.
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the code has platform-specific
        # branches (permission tightening, subprocess transport) that Linux CI
        # cannot exercise, and the maintainer develops on Windows.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Secret and production artifact gate
        run: python scripts/check_secrets.py --committed

      - name: PR title format
        # Only on pull requests: an owner's direct push has no title to check. This
        # lives inside `backend` on purpose — that job is already a required check, so
        # a bad title blocks the PR without adding a seventh context to the ruleset.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_pr_title.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dependency vulnerability scan
        # Replaces `tests/test_wave4_plugin_review.py::test_review_no_known_dependency_...`
        # which called `pytest.importorskip("pip_audit")`. pip-audit was never installed
        # in CI, so that "gate" skipped on every run — a check that cannot fail is not a
        # gate, and the project shipped with no dependency scan at all. Measured before
        # making this blocking: the pinned runtime set reports no known advisories.
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit --progress-spinner off

      - name: Dependency manifests agree
        run: python scripts/check_deps.py

      - name: Version declarations agree
        # Six files spell the product version and no build tool reconciles them; a
        # release that bumps five ships a wheel, a panel and a desktop shell that
        # disagree about which version is running. Also refuses runtime code that
        # restates the number instead of importing `__version__`.
        run: python scripts/check_version_consistency.py

      - name: Console encoding is safe on Windows
        # This failure has now happened twice: a script prints Chinese, the Windows
        # runner's console is cp1252, and the job dies with UnicodeEncodeError — on the
        # one platform the maintainer cannot reproduce. Verified to fail on a probe
        # script that prints CJK without reconfiguring its streams.
        run: python scripts/check_console_encoding.py

      - name: Container config is consistent
        # Runs on the CI runner, not on the maintainer's machine: this is the only
        # place where the Linux-only assumptions (bind address reachability, read_only
        # plus tmpfs) are checked against a Linux host. It still cannot start a
        # container — there is no daemon here either — so it verifies configuration,
        # not runtime. `docker build` happens on the deployment host.
        run: python scripts/check_deploy.py

      - name: Plugin IPC audit
        # Static, offline gate for the negative invariants of the plugin boundary:
        # no pickle, one frame budget shared with both child scripts, request
        # correlation ids, parent-side authorization, stdout drain and process cap.
        run: python scripts/check_plugin_ipc.py

      - name: Security boundary audit
        # The 20 contracts in docs/security-boundaries.md. Mostly negative
        # invariants (no shell=True, no localStorage token, no raw exception text),
        # which a passing unit test cannot keep from quietly coming back.
        run: python scripts/check_security_boundaries.py

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check (ratchet)
        # `make check` runs the same script, so a contributor sees this before pushing.
        # The check used to live in `types` as advisory; here it blocks, because "the
        # count may not grow" is a rule that can actually be enforced — unlike "fix the
        # whole backlog", which nobody is being asked to do in this change.
        run: python scripts/check_mypy_baseline.py

      - name: Contrast
        # `make check` runs this; CI must run the same set or the two gates disagree
        # and the local one becomes decorative.
        run: python scripts/check_contrast.py

      - name: Accessibility (static rules)
        run: python scripts/check_a11y.py

      - name: Desktop shell (static rules)
        # The Tauri shell is a build-time artifact and `cargo` is not on this job's
        # image, but the mistakes that matter here are policy, not compilation: a
        # wildcard CSP, a remote script, a shell that spawns a second backend on the
        # same port. Those are readable from the config alone.
        run: python scripts/check_desktop.py

      - name: Doc links
        # Splitting README into docs/ broke four links in one commit; a dead link is
        # invisible until somebody clicks it.
        run: python scripts/check_doc_links.py

      - name: Test gaps
        # Two static rules: modules no test names, and a "N passed" in prose that
        # disagrees with the board. Deliberately not coverage — see the script header.
        run: python scripts/check_test_gaps.py --strict

      - name: Test
        # No `data/` directory exists in a fresh checkout. That is the point: the
        # suite must pass without it, which is exactly what used to fail.
        #
        # `--timeout-method` is not used: the deadline lives in tests/conftest.py and
        # is armed per test, so it needs no plugin and cannot be forgotten in a
        # one-off `pytest path::test` invocation.
        run: python -m pytest -q

      - name: Hang dump
        # The conftest watchdog hard-exits the run when a single test exceeds its
        # deadline, and writes the stack to a file rather than stderr — pytest owns
        # fd 2, so a stderr dump is captured and thrown away on exit. Without this
        # step the file would be invisible and the red badge would again say only
        # "The operation was canceled."
        if: failure()
        shell: bash
        run: |
          if [ -f pytest-hang-dump.log ]; then
            echo "::group::test hang dump"
            cat pytest-hang-dump.log
            echo "::endgroup::"
          else
            echo "no hang dump: the failure was an assertion, not a stall"
          fi

  types:
    # Advisory: reports the current type-error count so it cannot grow silently,
    # without turning a pre-existing baseline into a red build. When the count
    # reaches zero this job should become gating and move into `backend`.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type check (ratchet)
        # Same script as the `backend` job, deliberately: this job used to run mypy as
        # advisory while backend ran nothing, so the only type signal was a number in a
        # log. Keeping both jobs on the same guard means a red result here points at the
        # same rule a contributor can run locally.
        run: python scripts/check_mypy_baseline.py

  frontend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        # `npm ci`, not `npm ci || npm install`. The fallback silently re-resolved the
        # tree whenever the lockfile was merely present-but-stale, so "the build works
        # on my machine" and "the lockfile is honoured" were never the same claim. The
        # lockfile is committed and verified consistent, so this fails loudly instead.
        run: cd webui && npm ci --no-audit --no-fund

      - name: Type check
        run: cd webui && npm run typecheck

      # The panel is a static bundle: a bad translation key or a route that does not
      # exist type-checks and builds cleanly, then shows the operator a raw key or a
      # 404. Both shipped that way, so both are now build failures.
      - name: Translation keys
        run: cd webui && npm run check:i18n

      - name: API paths exist
        run: cd webui && npm run check:api

      - name: Lint
        run: cd webui && npm run lint

      - name: Unit tests
        run: cd webui && npm test

      - name: Build panel
        run: cd webui && npm run build

  mobile:
    # Analyze + Dart tests + a downloadable debug APK. The runner image ships an
    # Android SDK; building here (rather than "on demand") is what makes the artifact
    # actually available from every PR, so an operator can install it on a real phone
    # or an emulator without owning a Flutter toolchain. `flutter analyze` defaults
    # keep deprecation infos non-fatal: the codebase targets Flutter >= 3.22, where
    # `package:material_ui` does not exist yet.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the SDK verification ran against: `channel: stable`
          # floats, and a newer Flutter turned 7 deprecation *infos* into exit-code-1
          # (material.dart -> package:material_ui). mobile/README records the same
          # decision; bump the two together.
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Pub get
        run: cd mobile && flutter pub get

      - name: Analyze
        run: cd mobile && flutter analyze

      - name: Unit tests
        run: cd mobile && flutter test

      - name: Build debug APK
        run: cd mobile && flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soapbot-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    # This job stays a `cargo check`: the fast signal that the Rust side still matches
    # the Tauri 2 API, on every push, on the cheapest runner.
    #
    # The installer itself is built by `desktop-bundle` below, on demand. It was
    # deliberately absent for a while — "shipping an unsigned artifact is worse than
    # shipping none" — and that trade is wrong for this project: the bundle is the only
    # Windows "double-click and it works" path, and an installer with two extra
    # SmartScreen clicks beats no installer while a certificate is pending. The warning
    # is documented in docs/desktop-signing.md rather than hidden.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: System libraries for Tauri
        # Tauri 2 links against WebKitGTK on Linux even for `cargo check`.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Static shell gate
        run: python scripts/check_desktop.py

      - name: cargo check
        # `--locked`: the shell is an application, so `Cargo.lock` is committed and must
        # be what compiles. Without it cargo is free to silently rewrite the lock and
        # the reproducibility the committed file promises disappears.
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets

  desktop-bundle:
    # The real desktop installers, one per OS. Off the default path on purpose: a Rust
    # release build, a PyInstaller freeze and NSIS/dmg/AppImage tooling add many
    # minutes to every push for artifacts nobody downloads from a pull request.
    #
    # Trigger with `gh workflow run ci` or by pushing a `v*` tag.
    #
    # All outputs are UNSIGNED: SmartScreen/Gatekeeper show the usual warnings until
    # certificates are configured. That is a documented trade (docs/desktop-signing.md),
    # not an oversight. macOS builds run on GitHub's macOS runners; Linux needs the
    # webkit2gtk system packages Tauri links against.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            artifact: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux webkit packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Build the panel
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Freeze the backend the shell spawns
        # `tauri.conf.json` points `bundle.resources` at `src-tauri/binaries/`, and the
        # build script stages the frozen binary there (`.exe` only on Windows). Without
        # this the installer ships a shell that can only connect to a running service.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sidecar]"
          python desktop/sidecar/build.py

      - name: Build the installers
        working-directory: desktop
        run: |
          npm ci
          npm run build -- --bundles ${{ matrix.bundles }}

      - name: Report what was produced
        shell: bash
        run: |
          find desktop/src-tauri/target/release/bundle             -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb"             | xargs -r ls -lh

      - uses: actions/upload-artifact@v7
        with:
          name: soapbot-desktop-unsigned-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [backend, frontend]
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Committed panel is present and self-consistent
        # Runs BEFORE the build on purpose. Deployment hosts frequently have no node, so
        # the committed dist/ is what they actually serve; rebuilding first regenerates
        # it and hides a missing or stale copy. This is the gate the old job never had:
        # it built the panel and then checked the wheel, so "the wheel has a panel" was
        # true by construction and said nothing about the repository.
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          dist = Path("src/soapbot/webui/dist")
          index = dist / "index.html"
          if not index.is_file():
              sys.exit("committed panel missing: src/soapbot/webui/dist/index.html")
          html = index.read_text(encoding="utf-8")
          referenced = re.findall(r'(?:src|href)="(/assets/[^"]+)"', html)
          missing = [a for a in referenced if not (dist / a.lstrip("/")).is_file()]
          if missing:
              sys.exit(f"index.html references missing assets: {missing}")
          print(f"committed panel ok: {len(referenced)} referenced assets present")
          PY

      - name: Wheel contains the committed panel (no rebuild)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/wheel-committed
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path

          wheel = next(Path("/tmp/wheel-committed").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.endswith("soapbot/webui/dist/index.html") for n in names):
              sys.exit("wheel built from the committed tree has no panel")
          print("committed-dist wheel ok")
          PY

      - name: Build panel
        run: cd webui && npm ci --no-audit --no-fund && npm run build

      - name: Panel sources and the committed build moved together (advisory)
        # A source edit without a rebuilt panel ships an old UI to hosts that cannot
        # build one. Enforcing that by rebuilding and diffing does not work: measured on
        # the *same* commit, Linux and Windows produce entirely different asset hashes
        # (`PluginsView-DZB7IC1-.js` here vs `PluginsView-CYvkoxO2.js` locally), so a
        # comparison fails on every run regardless of staleness. Pinning the build
        # platform is the real fix and is tracked separately; until then this checks the
        # diff for intent and stays advisory so a false positive cannot block a release.
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base commit; skipping"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          if echo "$changed" | grep -Eq '^webui/src/.*\.(ts|vue|css)$'; then
            if ! echo "$changed" | grep -q '^src/soapbot/webui/dist/'; then
              echo "::warning::webui/src changed but src/soapbot/webui/dist was not rebuilt and committed"
              exit 1
            fi
          fi
          echo "panel sources and dist moved together"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Wheel contains the panel
        # Checked against the *wheel*, not the source tree: hatchling selects files
        # with VCS rules by default, and a gitignored build output is exactly what
        # those rules drop.
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          required = [
              "soapbot/webui/dist/index.html",
              "soapbot/examples/plugins/echo/plugin.yaml",
              "soapbot/examples/plugins/echo/main.py",
          ]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          if missing:
              print("wheel is missing:", missing, file=sys.stderr)
              sys.exit(1)
          print(f"wheel ok: {len(names)} entries")
          PY

      - name: Wheel installs and serves the panel
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          from soapbot.app import create_app
          from soapbot.examples import bundled_plugins_dir
          app = create_app()
          assert bundled_plugins_dir().joinpath("echo", "plugin.yaml").is_file()
          print("installed wheel builds an app:", len(app.routes), "routes")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: soapbot-wheel
          path: dist/*.whl
          retention-days: 7

  release:
    # Tag-driven. `package` and `desktop-bundle` already produced the two artifacts;
    # this job only attaches them to a Release, so nobody uploads by hand from a laptop
    # and quietly ships a build that was never tested.
    #
    # `contents: write` is scoped to this job rather than the workflow: a test that
    # somehow reaches the token still cannot publish anything.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Show what will be published
        run: find artifacts -type f -printf '%p %s bytes\n'

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            artifacts/soapbot-wheel/*.whl \
            artifacts/soapbot-desktop-unsigned/*.exe
