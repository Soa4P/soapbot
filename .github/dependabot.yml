version: 2

# The project pins every runtime dependency to an exact patch version on purpose (see
# README and docs/configuration.md), which stops version drift but also means nobody
# notices a security release. Dependabot's job is to open the proposal; the pin stays
# exact, so a merge is still an explicit decision rather than a floating range.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Minor/patch bumps arrive as one PR so a routine refresh is a single review.
    # Major bumps stay individual: they are the ones that need a real look.
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      panel-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The desktop shell is an application, not a library, so `Cargo.lock` is committed
  # and must move with it — Dependabot updates both.
  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
